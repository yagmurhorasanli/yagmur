<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yağmur'um, Seni Seviyorum 💕</title>
    <meta name="description"
        content="Yağmur'um için hazırladığım özel bir sürpriz — Doğum günün ve Sevgililer Günün kutlu olsun." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600&family=Dancing+Script:wght@600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
</head>

<body>

    <!-- Canvas for particles -->
    <canvas id="heartCanvas"></canvas>

    <!-- ═══════════════════ LOCKED SCREEN ═══════════════════ -->
    <div id="lockedScreen" class="locked-screen">
        <div class="locked-inner">
            <div class="locked-lock">🔒</div>
            <p class="locked-desc">Bu sayfa sadece özel günlerde açılır.<br />Bir sonraki sürpriz için sabırla bekle 💕
            </p>

            <div class="locked-next">
                <span class="locked-next-label">Sıradaki özel gün:</span>
                <span class="locked-next-name">Tahmin Et Bakalım :)</span>
            </div>

            <div class="locked-countdown">
                <div class="lc-box"><span id="lc-days">00</span><label>Gün</label></div>
                <div class="lc-sep">:</div>
                <div class="lc-box"><span id="lc-hours">00</span><label>Saat</label></div>
                <div class="lc-sep">:</div>
                <div class="lc-box"><span id="lc-minutes">00</span><label>Dakika</label></div>
                <div class="lc-sep">:</div>
                <div class="lc-box"><span id="lc-seconds">00</span><label>Saniye</label></div>
            </div><!--
            <p class="locked-hint">✨ O gün geldiğinde bu sayfayı yeniden aç</p>
            <div style="padding-top: 5px;">Son Düzenlenme Tarihi: 05 Ocak 2026</div>-->

            <!-- ── Sayfa Geçiş Butonları ── -->
            <div class="page-nav-buttons">
                <a href="birthday.html" class="page-nav-btn">
                    <span class="nav-icon">🎂</span>
                    <span class="nav-label">Doğum Günü</span>
                </a>
                <a href="valentine.html" class="page-nav-btn">
                    <span class="nav-icon">💝</span>
                    <span class="nav-label">Sevgililer Günü</span>
                </a>
                <a href="meeting.html" class="page-nav-btn">
                    <span class="nav-icon">🏐</span>
                    <span class="nav-label">İlk Tanışmamız</span>
                </a>
                <a href="proposal.html" class="page-nav-btn">
                    <span class="nav-icon">🌹</span>
                    <span class="nav-label">Beraber Olduğumuz Gün</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        /* ─────────────────────────────────────────────
           TARİHLERİ BURADAN DEĞİŞTİR
        ───────────────────────────────────────────── */
        const SPECIAL_DAYS = [
            { month: 1, day: 1, page: 'birthday.html', name: '🎂 Doğum Günü (1 Ocak)' },
            { month: 2, day: 14, page: 'valentine.html', name: '💝 Sevgililer Günü (14 Şubat)' },
            { month: 7, day: 28, page: 'meeting.html', name: '🏐 İlk Tanışmamız (28 Temmuz)' },
            { month: 12, day: 16, page: 'proposal.html', name: '🌹 Beraber Olduğumuz Gün (16 Aralık)' },
        ];

        const now = new Date();
        const month = now.getMonth() + 1;
        const day = now.getDate();

        // Bugün özel bir gün mü? — Yönlendir
        const today = SPECIAL_DAYS.find(d => d.month === month && d.day === day);
        if (today) {
            sessionStorage.setItem('validRedirect', today.page);
            window.location.replace(today.page);
        } else {
            // Kilitli ekran: sıradaki güne geri sayım
            const AY = ['', 'Ocak', 'Şubat', 'Mart', 'Nisan', 'Mayıs', 'Haziran', 'Temmuz', 'Ağustos', 'Eylül', 'Ekim', 'Kasım', 'Aralık'];
            const y = now.getFullYear();
            const candidates = [];
            SPECIAL_DAYS.forEach(d => {
                candidates.push({ ...d, date: new Date(y, d.month - 1, d.day, 0, 0, 0) });
                candidates.push({ ...d, date: new Date(y + 1, d.month - 1, d.day, 0, 0, 0) });
            });
            const next = candidates.filter(c => c.date > now).sort((a, b) => a.date - b.date)[0];

            function tick() {
                const diff = next.date - new Date();
                if (diff <= 0) { location.reload(); return; }
                const d = Math.floor(diff / 86400000);
                const h = Math.floor((diff % 86400000) / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('lc-days').textContent = String(d).padStart(2, '0');
                document.getElementById('lc-hours').textContent = String(h).padStart(2, '0');
                document.getElementById('lc-minutes').textContent = String(m).padStart(2, '0');
                document.getElementById('lc-seconds').textContent = String(s).padStart(2, '0');
            }
            tick();
            setInterval(tick, 1000);
        }

        /* ─── Canvas: yüzen kalpler ─── */
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
        window.addEventListener('resize', resize); resize();
        function heartPath(x, y, size) {
            ctx.save(); ctx.translate(x, y); ctx.scale(size, size);
            ctx.beginPath(); ctx.moveTo(0, 0);
            ctx.bezierCurveTo(-0.5, -0.5, -1, 0.2, 0, 0.8);
            ctx.bezierCurveTo(1, 0.2, 0.5, -0.5, 0, 0);
            ctx.restore();
        }
        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width; this.y = canvas.height + 20;
                this.size = Math.random() * 12 + 4; this.speed = Math.random() * 0.8 + 0.3;
                this.alpha = Math.random() * 0.5 + 0.15; this.hue = Math.random() * 40 + 340;
                this.sway = Math.random() * 0.02 + 0.01; this.phase = Math.random() * Math.PI * 2;
            }
            update(t) {
                this.y -= this.speed; this.x += Math.sin(t * this.sway + this.phase) * 0.5;
                this.alpha -= 0.0008;
                if (this.y < -30 || this.alpha <= 0) this.reset();
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 90%, 68%)`;
                heartPath(this.x, this.y, this.size); ctx.fill(); ctx.restore();
            }
        }
        for (let i = 0; i < 50; i++) { const p = new Particle(); p.y = Math.random() * canvas.height; particles.push(p); }
        let t = 0;
        function animate() { ctx.clearRect(0, 0, canvas.width, canvas.height); t += 0.016; particles.forEach(p => { p.update(t); p.draw(); }); requestAnimationFrame(animate); }
        animate();
    </script>
</body>

</html>
